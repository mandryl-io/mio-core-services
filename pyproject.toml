[project]
name = "mio-core-services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.2",
    "numpy>=2.0.0",
    "pipecat-ai[cli,local,openai,runner,silero,webrtc]>=1.6.0",
    "pydantic>=2.13.4",
    "pyserial>=3.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
    "sentence-transformers>=5.0.0",
    "sounddevice>=0.5.0",
    "transformers>=5.15.0",
    "pywebrtc-audio>=0.1.0",
    "insightface>=0.7.3,<2",
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.10.0",
    "livekit>=1.1.18",
    "livekit-plugins-openai>=1.8.1",
    "livekit-plugins-ai-coustics>=0.3.2",
]

[tool.pytest.ini_options]
# Keep collection off the package; firmware CLIs are not test modules.
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mio_core_services"]
